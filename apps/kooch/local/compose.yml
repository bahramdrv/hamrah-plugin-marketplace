name: kooch-account-local
services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD}
      POSTGRES_DB: kooch
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - account-db:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kooch"]
      interval: 2s
      retries: 30
  mail:
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:58025:8025"]
  templates:
    image: nginx:1.28-alpine
    volumes:
      - ./confirmation.html:/usr/share/nginx/html/confirmation.html:ro
      - ./recovery.html:/usr/share/nginx/html/recovery.html:ro
  auth:
    image: supabase/gotrue:v2.197.0
    volumes:
      - ./confirmation.html:/templates/confirmation.html:ro
      - ./recovery.html:/templates/recovery.html:ro
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:59999:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:59999
      GOTRUE_SITE_URL: http://127.0.0.1:3100/account
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:3100/account
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${LOCAL_DB_PASSWORD}@db:5432/kooch?search_path=auth
      GOTRUE_JWT_SECRET: ${LOCAL_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: account@kooch.test
      GOTRUE_SMTP_SENDER_NAME: کوچ محلی
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /verify
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://templates/recovery.html
      GOTRUE_LOG_LEVEL: error
volumes:
  account-db:
