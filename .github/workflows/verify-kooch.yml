name: Verify Kooch local app
on:
  push:
    paths: ['apps/kooch/**', '.github/workflows/verify-kooch.yml']
  pull_request:
    paths: ['apps/kooch/**', '.github/workflows/verify-kooch.yml']
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/kooch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/kooch/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run account:setup
      - run: docker compose --env-file local/.env -f local/compose.yml up -d --wait
      - run: npm run account:migrate
      - run: npm run test:account
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
