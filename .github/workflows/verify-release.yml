name: Verify release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install --no-deps -r requirements-test.txt
      - run: npm run check:static
      - run: python -m compileall -q plugins/hamrah/skills
      - run: npm run verify:release
      - run: npm test
      - name: Python tests
        run: python -m pytest -q plugins/hamrah/skills/hamrah-profile-normalizer/tests plugins/hamrah/skills/hamrah-scorecard-engine/tests plugins/hamrah/skills/hamrah-signal-builder/tests plugins/hamrah/skills/hamrah-program-finder/tests
      - run: npm audit --omit=dev --audit-level=high
