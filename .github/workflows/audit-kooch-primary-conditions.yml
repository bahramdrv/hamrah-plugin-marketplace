name: Audit Kooch primary condition sources
on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * *'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/kooch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/kooch/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --import tsx scripts/audit-primary-conditions.ts
      - uses: actions/upload-artifact@v4
        with:
          name: public-primary-condition-audit
          path: apps/kooch/outputs/primary-condition-audit.json
          retention-days: 7
